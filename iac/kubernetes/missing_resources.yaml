# VULNERABLE: Deployment without CPU and memory resource limits (CKV_K8S_10, CKV_K8S_11)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unconstrained-billing-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
      - name: billing
        image: python:3.11-slim
        command: ["python", "-m", "http.server", "8080"]
