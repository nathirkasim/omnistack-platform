# VULNERABLE: Pod sharing host process, network, and IPC namespaces (CKV_K8S_17, CKV_K8S_18, CKV_K8S_19)
apiVersion: v1
kind: Pod
metadata:
  name: host-namespaces-pod
spec:
  hostPID: true
  hostNetwork: true
  hostIPC: true
  containers:
  - name: system-snoop
    image: busybox:1.36
    command: ["sleep", "3600"]
