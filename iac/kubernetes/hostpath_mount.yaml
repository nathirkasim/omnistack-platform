# VULNERABLE: Mounting sensitive host root filesystem into container (CKV_K8S_8)
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-root-mount-pod
spec:
  containers:
  - name: explorer
    image: alpine:3.19
    volumeMounts:
    - mountPath: /host
      name: host-root
  volumes:
  - name: host-root
    hostPath:
      path: /
