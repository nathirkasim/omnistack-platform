apiVersion: aibom.omniflow.internal/v1alpha1
kind: MachineLearningPipeline
metadata:
  name: crm-lead-scoring-inference-pipeline
  version: 2.4.0
  environment: production
spec:
  runtime:
    engine: onnxruntime
    version: "1.17.0"
    accelerator: CPU
    concurrency_threads: 4
  input_schema:
    features:
      - name: engagement_days
        type: integer
        nullable: false
        range: [0, 365]
      - name: deal_value
        type: float
        nullable: false
        range: [0.0, 10000000.0]
      - name: interaction_count
        type: integer
        nullable: false
      - name: industry_tier
        type: integer
        allowed_values: [1, 2, 3]
  output_schema:
    predictions:
      - name: lead_score
        type: float
        range: [0.0, 100.0]
      - name: tier
        type: string
        allowed_values: ["A_QUALIFIED", "B_WARM", "C_NURTURE", "D_COLD"]
  governance:
    lineage_tracking: enabled
    audit_log_retention_days: 365
    model_recalibration_cycle: quarterly
