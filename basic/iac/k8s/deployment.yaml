apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-processor
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      # GT: id=IAC-K8S-002 type=TP rule=k8s-host-network-enabled
      hostNetwork: true
      containers:
        - name: app
          image: app-service:1.2.0
          securityContext:
            # GT: id=IAC-K8S-001 type=TP rule=k8s-privileged-container
            privileged: true
            # GT: id=IAC-K8S-003 type=TP rule=k8s-run-as-root
            runAsNonRoot: false
            # GT: id=IAC-K8S-005 type=FP reason=read-only-root-filesystem
            readOnlyRootFilesystem: true
            capabilities:
              # GT: id=IAC-K8S-006 type=FP reason=drop-all-capabilities
              drop:
                - ALL
          volumeMounts:
            - mountPath: /var/run/docker.sock
              name: dockersock
      volumes:
        - name: dockersock
          hostPath:
            # GT: id=IAC-K8S-004 type=TP rule=k8s-hostpath-docker-socket
            path: /var/run/docker.sock
