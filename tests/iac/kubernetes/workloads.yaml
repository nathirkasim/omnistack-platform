# Infrastructure as Code Fixture: Kubernetes Manifests
# Covers paired True Positives and False Positives.

---
# ==============================================================================
# TP-IAC-004: Privileged Pod running as Root with Host Access
# High Severity | Container Escape Risk
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: vulnerable-privileged-pod
  namespace: default
spec:
  containers:
    - name: app
      image: nginx:1.21.6
      securityContext:
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true

---
# ==============================================================================
# FP-IAC-004: Hardened Non-Root Pod with Restricted Security Context
# Expected: Compliant / Safe
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: safe-hardened-pod
  namespace: default
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: cgr.dev/chainguard/nginx:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

---
# ==============================================================================
# TP-IAC-005: Publicly Exposed Service via NodePort
# Medium Severity | Unrestricted Network Access
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: vulnerable-nodeport-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  selector:
    app: backend

---
# ==============================================================================
# FP-IAC-005: Internal-Only ClusterIP Service
# Expected: Compliant / Safe
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: safe-clusterip-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: backend

---
# ==============================================================================
# TP-IAC-006: Hardcoded Secret in Plaintext Environment Variable
# Medium Severity | Credential Exposure in Manifest
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: vulnerable-plaintext-secret-pod
spec:
  containers:
    - name: worker
      image: alpine:3.18
      env:
        - name: DB_PASSWORD
          value: "super_secret_db_password_123"

---
# ==============================================================================
# FP-IAC-006: Environment Variable Injected via Kubernetes Secret Reference
# Expected: Compliant / Safe
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: safe-secret-ref-pod
spec:
  containers:
    - name: worker
      image: alpine:3.18
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-db-credentials
              key: password
