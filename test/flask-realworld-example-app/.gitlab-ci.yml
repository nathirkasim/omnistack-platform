---
stages:
  - build
  - test

.docker_template: &docker
  image: docker:19.03.8
  services:
    - docker:19.03.8-dind

git-clone:
  artifacts:
    paths:
      - src
  interruptible: true
  stage: build
  variables:
    REPO_DIR: src
    REPO_URL: https://github.com/gothinkster/flask-realworld-example-app.git
  script:
    - git clone --depth 1 $REPO_URL $REPO_DIR
    - ls -la

python-3.8.0:
  <<: *docker
  dependencies:
    - git-clone
  interruptible: true
  needs:
    - git-clone
  stage: test
  variables:
    DOCKERFILE: Dockerfile
    DOCKER_BASE_IMAGE: python:3.8.0-slim-buster
    PYTHON_PACKAGE_INSTALLER: pip install -r requirements.txt
    REPO_DIR: src
  script:
    - ./test/flask-realworld-example-app/test.sh
