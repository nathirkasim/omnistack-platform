---
stages:
  - setup
  - test

# Provide a template named &docker for dind jobs
.docker_template: &docker
  image: docker:19.03.8
  services:
    - docker:19.03.8-dind

# Clone git repo during setup
setup:clone-repo:
  artifacts:
    paths:
      - src
  interruptible: true
  stage: setup
  variables:
    REPO_URL: https://github.com/gothinkster/flask-realworld-example-app.git
  script:
    - make src

# Build Docker image as test
test:build-docker-image:
  <<: *docker
  interruptible: true
  needs:
    - git-clone
  stage: test
  variables:
    PYTHON_PACKAGE_INSTALLER: pip install -r requirements.txt
    REPO_DIR: src
  script:
    - make test
  parallel:
    matrix:
      - RUNTIME_VERSION: 3.8.0
