services:
  web:
    image: nginx:1.25.3
    ports:
    - "80:80"
  api:
    image: node:20-alpine
    privileged: false
  db:
    image: postgres:15.4-alpine
    ports:
    - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: "ProdSuperSecretPass123"
  metrics-agent:
    image: alpine:3.18.4
    volumes:
    - "/var/run/docker.sock:/var/run/docker.sock"
