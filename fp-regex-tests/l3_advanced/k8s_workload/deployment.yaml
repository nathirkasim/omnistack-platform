apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  labels:
    app.kubernetes.io/name: "order-processor-latest"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      hostNetwork: false
      hostPID: false
      containers:
      - name: processor
        image: redis:latest
        securityContext:
          privileged: false
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
      - name: privileged-diagnostics
        image: alpine:3.18.4
        securityContext:
          privileged: true
      volumes:
      - name: host-root
        hostPath:
          path: "/"
