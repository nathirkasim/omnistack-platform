apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload-processor
  labels:
    app.kubernetes.io/name: "privileged-broker"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      hostNetwork: false
      hostPID: false
      containers:
      - name: processor
        image: redis:latest
        securityContext:
          privileged: false
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
