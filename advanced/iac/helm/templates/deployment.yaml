apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-service
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          securityContext:
            {{- if .Values.debug.enabled }}
            # GT: id=IAC-HELM-0001 type=TP rule=helm-template-privileged-enabled technique=helm-render-resolution
            privileged: true
            {{- end }}
            # GT: id=IAC-HELM-0004 type=FP reason=helm-default-readonly-rootfs technique=helm-render-resolution
            readOnlyRootFilesystem: {{ .Values.security.readOnly | default true }}
      volumes:
        {{- if .Values.hostMount.enabled }}
        - name: host-sock
          hostPath:
            # GT: id=IAC-HELM-0002 type=TP rule=helm-template-docker-socket technique=helm-render-resolution
            path: {{ .Values.hostMount.path }}
        {{- end }}

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-svc
                port:
                  number: 80
  {{- if not .Values.tls.enabled }}
  # GT: id=IAC-HELM-0003 type=TP rule=helm-template-ingress-tls-disabled technique=helm-render-resolution
  # Ingress rendered without TLS block
  {{- else }}
  # GT: id=IAC-HELM-0005 type=FP reason=helm-template-tls-enabled technique=helm-render-resolution
  tls:
    - hosts: [api.example.com]
      secretName: tls-secret
  {{- end }}
