apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-release-service
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          image: app:1.0.0
          securityContext:
            readOnlyRootFilesystem: true
            privileged: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-release-ingress
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-svc
                port:
                  number: 80
  tls:
    - hosts: [api.example.com]
      secretName: tls-secret

