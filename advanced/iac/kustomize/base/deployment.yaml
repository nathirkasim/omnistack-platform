apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
  namespace: default
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: app
          image: app:1.0.0
          securityContext:
            # Base configuration (safe default overridden in prod overlay)
            privileged: false
            runAsNonRoot: false

