apiVersion: apps/v1
kind: Deployment
metadata:
  name: workload
spec:
  template:
    spec:
      containers:
        - name: app
          securityContext:
            # GT: id=IAC-KUST-0004 type=FP reason=unsafe-base-fixed-by-safe-overlay technique=kustomize-overlay-resolution
            runAsNonRoot: true
            capabilities:
              # GT: id=IAC-KUST-0005 type=FP reason=overlay-drops-all-capabilities technique=kustomize-overlay-resolution
              drop:
                - ALL
      volumes:
        - name: safe-cfg
          # GT: id=IAC-KUST-0006 type=FP reason=safe-configmap-volume-overlay technique=kustomize-overlay-resolution
          configMap:
            name: app-config
