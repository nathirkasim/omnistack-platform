apiVersion: v1
kind: Service
metadata:
  name: omniflow-service
  namespace: omniflow-prod
  labels:
    app: omniflow-crm
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: omniflow-crm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omniflow-ingress
  namespace: omniflow-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - crm.omniflow.internal
      secretName: omniflow-tls-cert
  rules:
    - host: crm.omniflow.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omniflow-service
                port:
                  number: 80
