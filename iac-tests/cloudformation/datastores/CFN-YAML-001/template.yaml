AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Storage Bucket with PublicRead ACL

Resources:
  PublicStorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: company-raw-uploads-2026
      AccessControl: PublicRead
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
