apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-insecure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      containers:
        - name: app
          image: {{ .Values.image }}
          securityContext:
            privileged: {{ .Values.privileged }}
