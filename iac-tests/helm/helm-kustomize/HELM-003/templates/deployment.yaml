apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: {{ .Values.image }}
          securityContext:
            {{- include "secure-app.hardenedSecurityContext" . | nindent 12 }}
