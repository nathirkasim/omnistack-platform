id: TF-POL-003
iac_type: terraform
category: policy-encoding
label: SAFE_LOOKALIKE
severity: LOW
description: S3 bucket policy uses Action = 's3:*' and Resource = '*' but contains
  Condition key aws:PrincipalOrgID and aws:SecureTransport neutralizing public risk
why_scanner_may_fail: Scanners that look only at Action and Resource wildcards without
  evaluating Condition keys produce False Positives because access is restricted solely
  to the AWS Organization over TLS.
