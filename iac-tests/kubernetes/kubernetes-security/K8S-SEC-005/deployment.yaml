apiVersion: apps/v1
kind: Deployment
metadata:
  name: anchor-override
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: app
          image: worker:1.0.0
          securityContext: &base_sec
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            # Override anchor property below
            privileged: true
