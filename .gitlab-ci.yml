---
stages:
  - build
  - test
  - deploy

.docker_template: &docker
  image: docker:19.03.8
  services:
    - docker:19.03.8-dind

example:git-clone:sanic-openapi:
  artifacts:
    paths:
      - /tmp/sanic-openapi/
  stage: build
  variables:
    REPO: https://github.com/huge-success/sanic-openapi.git
  script:
    - pwd
    - git clone $REPO /tmp/sanic-openapi
    - ls -la /tmp
    - echo "---------"
    - ls -la /tmp/sanic-openapi

example:docker-build:sanic-openai:
  <<: *docker
  dependencies:
    - example:git-clone:sanic-openapi
  stage: test
  script:
    - make srcdir=/tmp/sanic-openapi stage=production

example:git-clone:django-realworld-example:
  artifacts:
    paths:
      - /tmp/django-realworld-example/
  stage: build
  variables:
    REPO: https://github.com/gothinkster/django-realworld-example-app
  script:
    - pwd
    - git clone $REPO /tmp/django-realworld-example
    - ls -la /tmp
    - echo "---------"
    - ls -la /tmp/django-realworld-example

example:docker-build:django-realworld-example:
  <<: *docker
  dependencies:
    - example:git-clone:django-realworld-example
  stage: test
  variables:
    PYTHON_PACKAGE_INSTALLER: pip install -r requirements.txt
  script:
    - make srcdir=/tmp/django-realworld-example stage=production

build:
  stage: deploy
  script:
    - env
  rules:
    - when: manual
