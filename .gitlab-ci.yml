---
stages:
  - build
  - test
  - deploy

.docker_template: &docker
  image: docker:19.03.8
  services:
    - docker:19.03.8-dind

git-clone:sanic-openapi:
  artifacts:
    paths:
      - /tmp/sanic-openapi/
  stage: build
  variables:
    REPO: https://github.com/huge-success/sanic-openapi.git
  script:
    - pwd
    - git clone $REPO /tmp/sanic-openapi
    - ls -la /tmp
    - echo "---------"
    - ls -la /tmp/sanic-openapi

ruby-2.6.5:sanic-openai:
  <<: *docker
  dependencies:
    - git-clone:sanic-openapi
  needs:
    - git-clone:sanic-openapi
  stage: test
  variables:
    DOCKER_BASE_IMAGE: ruby:2.6.5-slim-buster
  script:
    - >
      docker build \
        --build-arg=BASE_IMAGE=${DOCKER_BASE_IMAGE} \
        --build-arg=PORTS=8000 \
        --target=production \
        /tmp/sanic-openapi

git-clone:django-realworld-example:
  artifacts:
    paths:
      - /tmp/django-realworld-example/
  stage: build
  variables:
    REPO: https://github.com/gothinkster/django-realworld-example-app
  script:
    - pwd
    - git clone $REPO /tmp/django-realworld-example
    - ls -la /tmp
    - echo "---------"
    - ls -la /tmp/django-realworld-example

python-3.8.0:django-realworld-example:
  <<: *docker
  dependencies:
    - git-clone:django-realworld-example
  needs:
    - git-clone:django-realworld-example
  stage: test
  variables:
    PYTHON_PACKAGE_INSTALLER: pip install -r requirements.txt
    DOCKER_BASE_IMAGE: python:3.8.0-slim-buster
  script:
    - >
      docker build \
        --build-arg=BASE_IMAGE=${DOCKER_BASE_IMAGE} \
        --build-arg=PORTS=8000 \
        --build-arg=PYTHON_PACKAGE_INSTALLER=${PYTHON_PACKAGE_INSTALLER} \
        --target=production \
        /tmp/django-realworld-example

build:
  stage: deploy
  script:
    - env
  rules:
    - when: manual
