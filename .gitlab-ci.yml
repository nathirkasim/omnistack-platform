# GitLab CI/CD Pipeline for OmniFlow Enterprise CRM
# Evaluates SAST, SCA, Secrets, IaC, SBOM, AIBOM, and CBOM engines

stages:
  - test
  - security
  - bom-generation
  - build

variables:
  SAST_EXCLUDED_ANALYZERS: ""
  SECRET_DETECTION_HISTORIC_SCAN: "false"

# Official GitLab Security Scanning Templates and Local Config
include:
  - local: 'ci.yaml'
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

test:unit:
  stage: test
  image: php:8.2-cli-alpine
  script:
    - php -l src/Core/Database.php
    - php -l src/Security/Sanitizer.php
    - php -l src/Service/Crypto/CryptoPolicyManager.php
    - php -l src/Service/AI/LeadScoringEngine.php
    - echo "Unit syntax validation complete."

sbom:cyclonedx:
  stage: bom-generation
  image: alpine:latest
  script:
    - echo "Validating PHP Composer and npm SBOM manifests..."
    - test -f composer.lock && echo "composer.lock verified for SCA/SBOM engine"
    - test -f package-lock.json && echo "package-lock.json verified for SCA/SBOM engine"
  artifacts:
    paths:
      - composer.lock
      - package-lock.json
      - cbom/cryptography-inventory.json
      - ai/models/lead_scorer/model-card.json
      - ai/pipeline_manifest.yaml
    reports:
      cyclonedx:
        - cbom/cryptography-inventory.json

aibom:validate:
  stage: bom-generation
  image: alpine:latest
  script:
    - echo "Validating AIBOM model card specifications..."
    - grep -q "omniflow-lead-scorer-enterprise" ai/models/lead_scorer/model-card.json
    - grep -q "onnxruntime" ai/pipeline_manifest.yaml
    - echo "AIBOM metadata integrity validated."

cbom:validate:
  stage: bom-generation
  image: alpine:latest
  script:
    - echo "Validating CBOM Cryptography inventory..."
    - grep -q "CycloneDX" cbom/cryptography-inventory.json
    - grep -q "Argon2id" cbom/cryptography-inventory.json
    - echo "CBOM specification compliant."
